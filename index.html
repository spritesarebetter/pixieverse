<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixieverse — MSX2 Object Editor</title>
<link rel="stylesheet" href="styles.css?v=20260911a">
<link rel="stylesheet" href="responsive.css?v=20260911a">
<link rel="stylesheet" href="app-editing.css?v=20260911a">
<link rel="stylesheet" href="layout.css?v=20260911a">
<link rel="stylesheet" href="ui-scale.css?v=20260911a">
</head>
<body>
<header>
  <div class="brandline"><h1>Pixieverse</h1></div>
  <div class="tools"><span id="status" class="headerstatus" title="Status">Ready</span><button id="new">New</button><button id="save">Save project</button><button id="load">Load project</button><input id="loadFile" type="file" accept=".msxsprite" hidden></div>
</header>
<main id="mainLayout">
  <aside id="previewColumn" class="panel leftpanel">
    <section id="previewSection" class="sideblock previewsection collapsible" data-collapsible>
      <div class="sectionhead"><h2>Preview</h2><button class="collapseToggle" type="button" aria-expanded="true" title="Hide Preview">▾</button></div>
      <div class="collapsebody">
        <div class="previewzoom"><button id="previewZoomIn" title="Zoom preview in">+</button><button id="previewZoomOut" title="Zoom preview out">−</button><span id="previewZoom" class="zoombadge">100%</span><button id="previewBorders" class="on" aria-pressed="true">Borders</button></div>
        <div id="previewWrap" class="previewwrap" title="Drag to pan · Ctrl+wheel to zoom · double-click to center"><canvas id="previewCanvas" class="artboardshadow compositecanvas" aria-label="Composite object preview"></canvas></div>
      </div>
    </section>
  </aside>

  <div id="mainSplitter" class="mainsplitter" role="separator" aria-orientation="vertical" aria-label="Resize preview and object editor" tabindex="0"></div>

  <section class="mid">
    <div class="panel editorpanel">
      <div class="editorhead">
        <div class="row wrap">
          <div class="editoridentity"><h2 id="title">Object editor</h2></div>
          <div class="tools">
            <label class="spritesizecontrol">Size<select id="spriteSize"><option value="16">16×16</option><option value="8">8×8</option></select></label>
            <button id="editorZoomIn" title="Zoom in">+</button><button id="editorZoomOut" title="Zoom out">−</button><span id="editorZoom" class="zoombadge">50%</span>
            <button id="undo" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button><button id="redo" disabled title="Redo (Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y)">Redo</button>
            <button id="pencil" class="iconbutton on" aria-label="Pencil" title="Pencil"><svg viewBox="0 0 24 24"><path d="M4 20l4.5-1 10-10-3.5-3.5-3.5 3.5-10 10L4 20z"/><path d="M13.8 6.7l3.5 3.5"/></svg></button>
            <button id="eraser" class="iconbutton erasericon" aria-label="Eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M3.8 15.2L12.9 6a2 2 0 0 1 2.8 0l2.3 2.3a2 2 0 0 1 0 2.8l-8.2 8.2H6.9l-3.1-3.1a1.4 1.4 0 0 1 0-2z"/><path d="M9.4 18.9l-4.1-4.1"/><path d="M10 19h10"/></svg></button>
            <button id="selectTool" class="iconbutton" aria-label="Select" title="Select"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/></svg></button>
            <button id="copyPixels" disabled>Copy</button><button id="pastePixels" disabled>Paste</button><button id="left">←</button><button id="right">→</button><button id="up">↑</button><button id="down">↓</button><button id="flipH">Flip H</button><button id="flipV">Flip V</button><button id="invert">Invert</button><button id="clear">Clear</button>
          </div>
        </div>
        <div class="objectactions">
          <button id="addLayer">＋ Sprite</button><button id="dupLayer">Duplicate sprite</button><button id="clearSprite">Clear sprite</button><button id="layerDel">Delete sprite</button>
        </div>
      </div>
      <div class="editorwork"><div id="editorWrap" class="editorwrap"><div id="editorStage" class="editorstage"><canvas id="editor" class="artboardshadow spritecanvas" title="Selected sprite"></canvas><div id="spriteColorRail" class="spritecolorrail"><div class="colorlabels"><span>Line color</span><span>OR</span></div><div id="lines"></div></div></div></div></div>
    </div>

    <div id="paletteBar" class="panel palettebar" aria-label="Palette toolbar">
      <select id="paletteFileSelect" class="palettechoose" title="Palette"></select>
      <div id="palette" class="palette paletteinline" aria-label="Palette colors"></div>
      <div class="palettebaractions">
        <button id="savePaletteLocal">Save</button><button id="deletePaletteLocal" disabled>Delete</button><button id="renamePaletteLocal">Rename</button><button id="savePaletteFile">Save .gpl</button><button id="loadPaletteFile">Load .gpl</button><button id="restorePaletteDefaults">Restore defaults</button>
      </div>
      <div class="palettergbinline" title="Selected color MSX RGB values"><span id="paletteIndex">Color 15</span><label>R<input id="msxR" type="number" min="0" max="7" step="1"></label><label>G<input id="msxG" type="number" min="0" max="7" step="1"></label><label>B<input id="msxB" type="number" min="0" max="7" step="1"></label></div>
      <input id="paletteFile" type="file" accept=".gpl" hidden>
    </div>

    <section class="panel timelinepanel collapsible" data-collapsible>
      <div class="timelinehead"><div class="sectionhead"><h2>Frames / animation</h2><div class="sectionactions"><button id="playFrames">Play</button><button id="stopFrames" disabled>Stop</button><button id="slowerFrames" class="speedarrow" title="Slow motion" aria-label="Slow motion">←</button><span id="playbackSpeed" class="playbackspeed" title="Playback speed">100%</span><button id="fasterFrames" class="speedarrow" title="Fast forward" aria-label="Fast forward">→</button><button id="addFrame">+Frame</button><button id="dupFrame">Duplicate</button><button id="delFrame">Delete</button><button id="exportFrameMenuButton" aria-haspopup="menu" aria-expanded="false">Export frame</button><button class="collapseToggle" type="button" aria-expanded="true" title="Hide Frames / animation">▾</button></div></div></div>
      <div class="collapsebody"><div id="frames" class="timeline"></div><p class="hint">Drag frames to reorder · Wait is measured in 60 Hz frames.</p></div>
    </section>
  </section>
</main>

<div id="frameExportMenu" class="frameexportmenu panel" role="menu" hidden>
  <div id="frameExportTitle" class="frameexporttitle">Export selected frame</div>
  <div class="frameexportbuttons"><button id="expPat" role="menuitem">patterns.bin</button><button id="expCol" role="menuitem">colors.bin</button><button id="expSat" role="menuitem">sat.bin</button><button id="expPal" role="menuitem">palette.bin</button><button id="expAsm" role="menuitem">Z80 .asm</button></div>
  <p id="warn" class="warning"></p>
</div>

<script src="app-core.js?v=20260911a"></script><script src="palette-presets.js?v=20260911a"></script><script src="app-canvas.js?v=20260911a"></script><script src="app-ui.js?v=20260911a"></script><script src="app-palettes.js?v=20260911a"></script><script src="app-preview.js?v=20260911a"></script><script src="app-sprites.js?v=20260911a"></script><script src="app-frames.js?v=20260911a"></script><script src="app-editing.js?v=20260911a"></script><script src="app-patterns.js?v=20260911a"></script><script src="app-panels.js?v=20260911a"></script>
</body>
</html>
