<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SynTracker v2</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#10141b;--line:#27303c;--text:#d8e1eb;--muted:#728093;--cyan:#59e5e5;--pink:#ff6ccf;--amber:#f3bd5b;--green:#67e8a5;--danger:#ff6f78;--row:28px;--index:34px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:radial-gradient(circle at 15% 0%,rgba(89,229,229,.07),transparent 34%),radial-gradient(circle at 85% 0%,rgba(255,108,207,.05),transparent 30%),var(--bg);color:var(--text);font-size:11px}button,input{font:inherit;color:inherit}
.app{height:100vh;display:grid;grid-template-rows:34px 56px minmax(0,1fr) 58px 24px}
.menubar{display:flex;align-items:center;gap:15px;padding:0 10px;background:#0c1016;border-bottom:1px solid #202733;user-select:none}.brand{display:flex;align-items:center;gap:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.mark{width:18px;height:18px;border-radius:5px;background:conic-gradient(from 45deg,var(--cyan),var(--pink),var(--amber),var(--cyan));position:relative}.mark:after{content:"";position:absolute;inset:4px;background:#0c1016;border-radius:2px}.menu{color:#95a2b1}.spacer{flex:1}.project{border:0;outline:0;background:transparent;color:#aeb9c7;text-align:right;width:150px}
.toolbar{display:grid;grid-template-columns:auto auto auto minmax(140px,1fr) auto;gap:7px;align-items:center;padding:6px 8px;background:#0f131a;border-bottom:1px solid var(--line)}.group{height:42px;display:flex;align-items:center;gap:4px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:#111720}.transport button,.icon{width:28px;height:28px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer}.transport button:hover,.icon:hover{background:#202936;border-color:#303c4b}.transport .active{background:#183a33;color:var(--green);border-color:#285a4e}.metric{display:grid;grid-template-columns:auto 48px;gap:2px 4px;align-items:center}.metric label{color:var(--muted);text-transform:uppercase;font-size:8px;letter-spacing:.1em}.metric input{width:48px;height:24px;border:1px solid #303a48;border-radius:4px;background:#0b0f15;text-align:center;outline:0}.metric input:focus{border-color:var(--cyan)}.position{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;color:var(--muted)}.position strong{color:#eef5ff;font-family:Consolas,monospace}.timeline{height:4px;border-radius:99px;background:#27313d;overflow:hidden}.timeline span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),#9ae7ff)}
.workspace{min-height:0;background:#252d37}.tracker{height:100%;min-width:0;min-height:0;display:grid;grid-template-rows:68px minmax(0,1fr);background:#0b0e13;overflow:hidden}.head-strip{min-width:0;overflow:hidden;border-bottom:1px solid #313a47;background:#11161d}.heads,.pattern-row{width:100%;display:grid;grid-template-columns:var(--index) repeat(17,minmax(0,1fr)) var(--index)}.heads{height:100%}.corner{display:grid;place-items:center;background:#11161d;color:#536174;font:9px Consolas,monospace}.corner.left{border-right:1px solid #34404c}.corner.right{border-left:1px solid #34404c}.channel-head{min-width:0;position:relative;padding:4px 1px 3px;border-right:1px solid #252e39;background:#141a22;overflow:hidden}.channel-head:before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--group);opacity:.85}.channel-name{font-size:clamp(9px,.64vw,11px);font-weight:850;white-space:nowrap;text-align:center;letter-spacing:-.03em}.channel-controls{margin-top:3px;display:grid;grid-template-columns:minmax(0,1fr) 1.25ch;gap:1px;align-items:center;padding:0 1px}.channel-volume{width:100%;min-width:0;height:12px;margin:0;appearance:none;background:transparent;cursor:pointer;accent-color:var(--group)}.channel-volume::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:#2c3642}.channel-volume::-webkit-slider-thumb{appearance:none;width:7px;height:11px;margin-top:-4px;border:0;border-radius:2px;background:var(--group);box-shadow:0 0 0 1px #0a0d12}.channel-volume::-moz-range-track{height:3px;border-radius:3px;background:#2c3642}.channel-volume::-moz-range-progress{height:3px;background:var(--group)}.channel-volume::-moz-range-thumb{width:7px;height:11px;border:0;border-radius:2px;background:var(--group)}.vol-readout{text-align:center;font:700 clamp(8px,.54vw,10px) Consolas,monospace;color:var(--group)}.head-bottom{display:flex;align-items:center;gap:1px;margin-top:2px}.meter{flex:1;height:3px;background:#252e39;border-radius:3px;overflow:hidden}.meter span{display:block;height:100%;width:8%;background:var(--group);transition:width .1s}.tiny{width:14px;height:13px;padding:0;border:0;border-radius:2px;background:transparent;color:#66758a;font-size:8px;cursor:pointer}.tiny.active{background:#293341;color:#fff}.tiny.mute.active{color:var(--danger);background:#3b2026}.tiny.solo.active{color:var(--amber);background:#3d311d}.psg{--group:var(--cyan)}.scc{--group:var(--pink)}.opll{--group:var(--amber)}
.viewport{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;outline:0;scrollbar-width:thin;scrollbar-color:#3a4655 #11161d}.pattern{width:100%;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:clamp(12px,.82vw,16px);user-select:none}.pattern-row{height:var(--row)}.pattern-row:nth-child(4n+1) .cell,.pattern-row:nth-child(4n+1) .rownum{background-color:rgba(255,255,255,.014)}.pattern-row:nth-child(16n+1) .cell,.pattern-row:nth-child(16n+1) .rownum{box-shadow:inset 0 1px #2e3946}.pattern-row.playing .cell{background-color:rgba(89,229,229,.045)}.pattern-row.playing .rownum{color:#fff;background:#164249}.rownum{display:grid;place-items:center;background:#0f141b;color:#526074;border-bottom:1px solid #171d25;font-size:10px}.rownum.left{border-right:1px solid #34404c}.rownum.right{border-left:1px solid #34404c}.rownum.beat{color:#91a1b4;font-weight:700}.cell{min-width:0;height:var(--row);display:grid;grid-template-columns:3ch 1ch 1ch 3ch;justify-content:center;column-gap:.04ch;align-items:center;padding:0;border-right:1px solid #242c36;border-bottom:1px solid #171d25;background:#0c1016;cursor:cell;white-space:nowrap;overflow:hidden;position:relative}.cell:hover{background:#131a22}.cell.selected{background:#16232a!important;outline:1px solid rgba(89,229,229,.68);outline-offset:-1px;z-index:2}.cell span{text-align:center;overflow:hidden;padding:0}.note{color:#dce7f4;font-weight:700}.vol{color:#e78ecb}.ins{color:#73d9e2}.fx{color:#d6b96e}.cell.empty span{color:#354150}.cell .vol,.cell .ins,.cell .fx{border-left:1px solid #1b222b}
.order-dock{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 8px;background:#10151c;border-top:1px solid #2a3440;border-bottom:1px solid #252d38}.order-label{color:#8d9bad;text-transform:uppercase;font-size:9px;font-weight:850;letter-spacing:.13em}.order-list{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;min-width:0}.order-row{height:34px;display:grid;grid-template-rows:auto auto;place-items:center;border:1px solid #2b3542;border-radius:4px;background:#121820;color:#7d8b9c;font-family:Consolas,monospace;cursor:pointer;overflow:hidden}.order-row:hover{background:#18212b;color:#d5deea}.order-row.active{border-color:#31727a;background:#173039;color:var(--cyan);box-shadow:inset 0 -2px var(--cyan)}.order-row .pat{font-size:12px;font-weight:800;color:#dbe5ef}.order-row .ord{font-size:8px;color:#657487}.dock-options{display:flex;gap:9px;align-items:center;color:#7f8da0;font-size:9px}.switch-pair{display:flex;align-items:center;gap:4px}.switch{width:26px;height:15px;border:1px solid #35404e;border-radius:99px;background:#27313d;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:9px;height:9px;left:2px;top:2px;border-radius:50%;background:#8492a3;transition:.14s}.switch.on{background:#1b4a44;border-color:#2d6a61}.switch.on:after{left:13px;background:var(--green)}
.status{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:0 8px;background:#0c1015;color:#617084;font-size:9px}.status strong{color:#9ba9bb}.led{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--green);box-shadow:0 0 7px rgba(103,232,165,.45)}.kbd{border:1px solid #364251;border-bottom-color:#4d5b6b;border-radius:3px;background:#161c24;color:#a8b4c3;padding:1px 3px}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,8px);padding:6px 10px;border:1px solid #344151;border-radius:6px;background:#1b232d;color:#cbd6e3;opacity:0;pointer-events:none;transition:.16s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1450px){.pattern{font-size:clamp(11px,.82vw,13px)}.channel-name{font-size:9px}.menu{display:none}.order-dock{grid-template-columns:42px minmax(0,1fr)}.dock-options{display:none}}
@media(max-width:1050px){.toolbar{grid-template-columns:auto auto auto 1fr}.toolbar>.group:last-child{display:none}.pattern{font-size:10px}.order-row .pat{font-size:10px}}
@media(max-width:800px){.toolbar{grid-template-columns:auto auto 1fr}.toolbar>.group:nth-child(3),.position{display:none}.pattern{font-size:7.5px}.tracker{grid-template-rows:62px minmax(0,1fr)}.order-label{display:none}.order-dock{grid-template-columns:minmax(0,1fr)}.status{grid-template-columns:auto 1fr auto}.status span:nth-child(3){display:none}}
</style>
</head>
<body>
<main class="app">
<header class="menubar"><div class="brand"><span class="mark"></span>SynTracker v2</div><span class="menu">File</span><span class="menu">Edit</span><span class="menu">Pattern</span><span class="menu">Instrument</span><span class="menu">View</span><span class="spacer"></span><input class="project" value="untitled-v2.syt" aria-label="Project name"></header>
<section class="toolbar">
  <div class="group transport"><button id="stop" title="Stop">■</button><button id="play" title="Play / pause">▶</button><button id="loop" class="active" title="Loop">↻</button><button id="record" title="Record">●</button></div>
  <div class="group"><div class="metric"><label>BPM</label><input id="bpm" type="number" min="32" max="300" value="150"></div><div class="metric"><label>Speed</label><input id="speed" type="number" min="1" max="31" value="6"></div></div>
  <div class="group"><div class="metric"><label>Octave</label><input id="octave" type="number" min="0" max="8" value="4"></div><div class="metric"><label>Step</label><input id="step" type="number" min="0" max="16" value="1"></div></div>
  <div class="group position"><strong id="pos">00 : 00</strong><div class="timeline"><span id="fill"></span></div><span>Pattern 00</span></div>
  <div class="group"><button class="icon" id="save" title="Save locally">⇩</button><button class="icon" id="clear" title="Clear pattern">⌫</button></div>
</section>
<section class="workspace"><section class="tracker"><div class="head-strip"><div id="heads" class="heads"><div class="corner left">ROW</div></div></div><div id="viewport" class="viewport" tabindex="0" aria-label="Pattern editor"><div id="pattern" class="pattern"></div></div></section></section>
<section class="order-dock"><div class="order-label">Order</div><div id="orders" class="order-list"></div><div class="dock-options"><span class="switch-pair">Follow <span id="follow" class="switch on"></span></span><span class="switch-pair">Hex rows <span id="hexRows" class="switch on"></span></span></div></section>
<footer class="status"><span><span class="led"></span><strong>Ready</strong></span><span id="statusText">PSG1 · row 00</span><span><span class="kbd">Space</span> play &nbsp; <span class="kbd">Z–M</span> notes &nbsp; <span class="kbd">Del</span> clear</span><span>17 channels · NNN V I FFF</span></footer>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{
const channels=[...Array.from({length:3},(_,i)=>({name:`PSG${i+1}`,group:'psg'})),...Array.from({length:5},(_,i)=>({name:`SCC${i+1}`,group:'scc'})),...Array.from({length:9},(_,i)=>({name:`OPLL${i+1}`,group:'opll'}))];
const rows=64,heads=document.getElementById('heads'),pattern=document.getElementById('pattern'),viewport=document.getElementById('viewport'),orders=document.getElementById('orders'),play=document.getElementById('play'),bpm=document.getElementById('bpm'),octave=document.getElementById('octave'),step=document.getElementById('step'),pos=document.getElementById('pos'),fill=document.getElementById('fill'),follow=document.getElementById('follow'),toast=document.getElementById('toast'),statusText=document.getElementById('statusText');
let selected={row:0,ch:0},playing=false,playRow=0,timer=null,currentPattern=0,looping=true;const data=new Map();const state=channels.map(()=>({volume:12,mute:false,solo:false}));
const keys={z:0,s:1,x:2,d:3,c:4,v:5,g:6,b:7,h:8,n:9,j:10,m:11,q:12,'2':13,w:14,'3':15,e:16,r:17,'5':18,t:19,'6':20,y:21,'7':22,u:23},notes=['C-','C#','D-','D#','E-','F-','F#','G-','G#','A-','A#','B-'];
const hex=n=>Math.max(0,n).toString(16).toUpperCase(),h2=n=>hex(n).padStart(2,'0'),key=(r,c)=>`${currentPattern}:${r}:${c}`;
function message(t){toast.textContent=t;toast.classList.add('show');clearTimeout(message.t);message.t=setTimeout(()=>toast.classList.remove('show'),1200)}
function makeHead(ch,i){const el=document.createElement('div');el.className=`channel-head ${ch.group}`;el.innerHTML=`<div class="channel-name">${ch.name}</div><div class="channel-controls"><input class="channel-volume" type="range" min="0" max="15" step="1" value="${state[i].volume}" aria-label="${ch.name} volume"><span class="vol-readout">${hex(state[i].volume)}</span></div><div class="head-bottom"><div class="meter"><span></span></div><button class="tiny mute" title="Mute">M</button><button class="tiny solo" title="Solo">S</button></div>`;const slider=el.querySelector('.channel-volume'),readout=el.querySelector('.vol-readout');slider.addEventListener('input',e=>{state[i].volume=+e.target.value;readout.textContent=hex(state[i].volume)});el.querySelector('.mute').addEventListener('click',e=>{state[i].mute=!state[i].mute;e.currentTarget.classList.toggle('active',state[i].mute)});el.querySelector('.solo').addEventListener('click',e=>{state[i].solo=!state[i].solo;e.currentTarget.classList.toggle('active',state[i].solo)});el.addEventListener('mousedown',e=>{if(!e.target.matches('input,button'))select(selected.row,i,false)});return el}
channels.forEach((c,i)=>heads.appendChild(makeHead(c,i)));const rightCorner=document.createElement('div');rightCorner.className='corner right';rightCorner.textContent='ROW';heads.appendChild(rightCorner);
function makeCell(r,c){const el=document.createElement('div');el.className='cell empty';el.dataset.row=r;el.dataset.ch=c;el.innerHTML='<span class="note">...</span><span class="vol">.</span><span class="ins">.</span><span class="fx">...</span>';el.addEventListener('mousedown',()=>select(r,c));return el}
for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='pattern-row';row.dataset.row=r;const left=document.createElement('div');left.className=`rownum left ${r%4===0?'beat':''}`;left.textContent=h2(r);row.appendChild(left);channels.forEach((_,c)=>row.appendChild(makeCell(r,c)));const right=document.createElement('div');right.className=`rownum right ${r%4===0?'beat':''}`;right.textContent=h2(r);row.appendChild(right);pattern.appendChild(row)}
function setVisual(el,v){const s=el.children;if(!v){el.classList.add('empty');s[0].textContent='...';s[1].textContent='.';s[2].textContent='.';s[3].textContent='...';return}el.classList.remove('empty');s[0].textContent=v.note||'...';s[1].textContent=v.vol??'.';s[2].textContent=v.ins??'.';s[3].textContent=v.fx||'...'}
function render(){document.querySelectorAll('.cell').forEach(el=>setVisual(el,data.get(key(+el.dataset.row,+el.dataset.ch))));select(selected.row,selected.ch,false)}
function select(r,c,focus=true){r=Math.max(0,Math.min(rows-1,r));c=Math.max(0,Math.min(16,c));document.querySelector('.cell.selected')?.classList.remove('selected');selected={row:r,ch:c};const el=pattern.querySelector(`.cell[data-row="${r}"][data-ch="${c}"]`);el?.classList.add('selected');pos.textContent=`${h2(currentPattern)} : ${h2(r)}`;statusText.textContent=`${channels[c].name} · row ${h2(r)} · NNN V I FFF`;if(focus)viewport.focus({preventScroll:true})}
function renderOrders(){orders.innerHTML='';for(let i=0;i<16;i++){const o=document.createElement('div');o.className=`order-row ${i===currentPattern?'active':''}`;o.innerHTML=`<span class="ord">${h2(i)}</span><span class="pat">${h2(i)}</span>`;o.onclick=()=>switchPattern(i);orders.appendChild(o)}}
function switchPattern(i){currentPattern=i;playRow=0;renderOrders();render();pos.textContent=`${h2(i)} : ${h2(selected.row)}`;message(`Pattern ${h2(i)}`)}
function noteKey(k){if(!(k in keys))return false;const n=keys[k],name=`${notes[n%12]}${+octave.value+Math.floor(n/12)}`,v=data.get(key(selected.row,selected.ch))||{vol:hex(state[selected.ch].volume),ins:'1',fx:'...'};v.note=name;data.set(key(selected.row,selected.ch),v);setVisual(pattern.querySelector(`.cell[data-row="${selected.row}"][data-ch="${selected.ch}"]`),v);select(Math.min(rows-1,selected.row+(+step.value||0)),selected.ch,false);return true}
function clearCell(){data.delete(key(selected.row,selected.ch));setVisual(pattern.querySelector(`.cell[data-row="${selected.row}"][data-ch="${selected.ch}"]`),null)}
function seed(){for(let r=0;r<rows;r+=4){const c=(r/4)%8;data.set(`0:${r}:${c}`,{note:['C-4','E-4','G-4','A#4'][(r/4)%4],vol:hex(8+(r/4)%8),ins:hex((c%15)+1),fx:r%8===0?'A03':'...'});}}
function interval(){return(60000/Math.max(32,Math.min(300,+bpm.value||150)))/4}function schedule(){clearInterval(timer);if(playing)timer=setInterval(tick,interval())}
function tick(){document.querySelector('.pattern-row.playing')?.classList.remove('playing');const row=pattern.querySelector(`.pattern-row[data-row="${playRow}"]`);row?.classList.add('playing');pos.textContent=`${h2(currentPattern)} : ${h2(playRow)}`;fill.style.width=`${(playRow+1)/rows*100}%`;document.querySelectorAll('.channel-head').forEach((h,i)=>{h.querySelector('.meter span').style.width=`${state[i].mute?2:Math.max(4,Math.random()*(state[i].volume/15)*100)}%`});if(follow.classList.contains('on'))row?.scrollIntoView({block:'center'});playRow++;if(playRow>=rows){if(looping)playRow=0;else stopPlayback()}}
function start(){playing=true;play.classList.add('active');play.textContent='❚❚';tick();schedule()}function pause(){playing=false;play.classList.remove('active');play.textContent='▶';clearInterval(timer)}function stopPlayback(){pause();playRow=0;document.querySelector('.pattern-row.playing')?.classList.remove('playing');fill.style.width='0';document.querySelectorAll('.meter span').forEach(m=>m.style.width='8%');pos.textContent=`${h2(currentPattern)} : ${h2(selected.row)}`}
play.onclick=()=>playing?pause():start();document.getElementById('stop').onclick=stopPlayback;bpm.onchange=schedule;document.getElementById('loop').onclick=e=>{looping=!looping;e.currentTarget.classList.toggle('active',looping)};document.getElementById('record').onclick=e=>e.currentTarget.classList.toggle('active');
viewport.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():start();return}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();clearCell();return}if(e.key==='ArrowUp'){e.preventDefault();select(selected.row-1,selected.ch,false);return}if(e.key==='ArrowDown'){e.preventDefault();select(selected.row+1,selected.ch,false);return}if(e.key==='ArrowLeft'){e.preventDefault();select(selected.row,selected.ch-1,false);return}if(e.key==='ArrowRight'){e.preventDefault();select(selected.row,selected.ch+1,false);return}if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&noteKey(e.key.toLowerCase()))e.preventDefault()});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'&&document.activeElement!==viewport){e.preventDefault();playing?pause():start()}});document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>s.classList.toggle('on'));
document.getElementById('save').onclick=()=>{localStorage.setItem('syntracker-v2-state',JSON.stringify({pattern:currentPattern,bpm:+bpm.value,octave:+octave.value,data:[...data],state}));message('Saved locally')};document.getElementById('clear').onclick=()=>{[...data.keys()].filter(k=>k.startsWith(`${currentPattern}:`)).forEach(k=>data.delete(k));render();message(`Pattern ${h2(currentPattern)} cleared`)};
function restore(){try{const raw=localStorage.getItem('syntracker-v2-state');if(!raw)return false;const d=JSON.parse(raw);currentPattern=Math.max(0,Math.min(15,d.pattern||0));bpm.value=d.bpm||150;octave.value=d.octave??4;(d.data||[]).forEach(([k,v])=>data.set(k,v));if(Array.isArray(d.state))d.state.slice(0,17).forEach((s,i)=>{state[i].volume=Math.max(0,Math.min(15,+s.volume||0));state[i].mute=!!s.mute;state[i].solo=!!s.solo});return true}catch{return false}}
if(!restore())seed();document.querySelectorAll('.channel-head').forEach((h,i)=>{h.querySelector('.channel-volume').value=state[i].volume;h.querySelector('.vol-readout').textContent=hex(state[i].volume);h.querySelector('.mute').classList.toggle('active',state[i].mute);h.querySelector('.solo').classList.toggle('active',state[i].solo)});renderOrders();render();select(0,0,false);
})();
</script>
</body>
</html>
